[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "word-sys-pdf-editor"
description = "An open-source tool for editing content in PDF files on Linux"
readme = "README.md"
authors = [
    { name = "Barın Güzeldemirci (word-sys)" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24.0,<2.0.0",
    "numpy",
    "pygobject",
    "anyconvert>=0.1.11",
    "cryptography>=41.0.0",
    "pyhanko[image-support,opentype]>=0.25.0",
    "pyhanko-certvalidator>=0.24.0",
    "python-pkcs11>=0.7.0",
    "asn1crypto>=1.5.1",
    "Pillow>=9.0.0",
    "certifi"
]

[project.urls]
Homepage = "https://github.com/word-sys/word-sys-pdf-editor/"
Source = "https://github.com/word-sys/word-sys-pdf-editor/"
Issues = "https://github.com/word-sys/word-sys-pdf-editor/issues"
Releases = "https://github.com/word-sys/word-sys-pdf-editor/releases"

[tool.setuptools]
packages = ["word_sys_pdf_editor"]

[tool.setuptools.package-data]
word_sys_pdf_editor = ["img/*", "icons/**", "locales/*.json", "LICENSE*"]

[tool.setuptools.dynamic]
version = {attr = "word_sys_pdf_editor.constants.APP_VERSION"}

[project.gui-scripts]
word-sys-pdf-editor = "word_sys_pdf_editor.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
